modLoader = "javafml"
loaderVersion = "[47,)"
issueTrackerURL = "${mod_repo_url}/issues"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''
logoFile = "${mod_logo}"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range_forge}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "jupiter"
mandatory = true
versionRange = "[2.3.7,)"
ordering = "NONE"
side = "BOTH"
